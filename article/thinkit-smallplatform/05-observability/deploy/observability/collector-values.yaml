# observability/collector-values.yaml
mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    # メトリクスをPrometheusのリモートライト受信エンドポイントへ送る
    prometheusremotewrite:
      endpoint: http://prometheus-server.observability.svc/api/v1/write
    # ログをLokiのネイティブOTLPエンドポイントへ送る
    otlphttp/logs:
      endpoint: http://loki-gateway.observability.svc/otlp

  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/logs]
