# observability/loki-values.yaml

# シングルバイナリ + ファイルシステム保存の最小構成（PC1台・デモ用）
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  # スキーマ定義（TSDB + filesystem）を明示しないとスケーラブル構成に倒れる
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  # OTLPで受け取った構造化メタデータを許可（後でCollectorから送るため）
  limits_config:
    allow_structured_metadata: true

# シングルバイナリを1レプリカで起動
singleBinary:
  replicas: 1

# スケーラブル構成用のコンポーネントは0にして立てない
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# デモ用に周辺コンポーネントは無効化（キャッシュ等）
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
